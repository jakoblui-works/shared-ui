name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      # registry-url writes a user-level .npmrc that reads NODE_AUTH_TOKEN (pnpm ignores tokens in the repo's .npmrc).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: https://npm.pkg.github.com
          scope: "@jakoblui-works"
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      # A published version can't be replaced, so only merged code is published.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} isn't on main; merge first, then tag" >&2
            exit 1
          fi
      - run: pnpm install
      # pnpm publish builds first (prepack). A tag checkout is a detached HEAD, which pnpm's git checks reject.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Built only for published versions, so the hosted Storybook always shows what the apps can install.
  build-storybook:
    needs: publish
    # One image build at a time: a later tag's build waits for an earlier one, so it ends up as `:latest`.
    concurrency:
      group: storybook-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f Dockerfile.storybook -t ghcr.io/jakoblui-works/shared-ui-storybook:${{ github.sha }} -t ghcr.io/jakoblui-works/shared-ui-storybook:latest .
          docker push ghcr.io/jakoblui-works/shared-ui-storybook:${{ github.sha }}
          docker push ghcr.io/jakoblui-works/shared-ui-storybook:latest
  trigger-deploy:
    needs: build-storybook
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # infra replaces this with the deploy's result, on this commit.
      - name: Mark the commit as waiting to deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=deploy -f description="Waiting to deploy"
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy \
            -f 'client_payload[repo]=shared-ui' -f "client_payload[sha]=$GITHUB_SHA"
