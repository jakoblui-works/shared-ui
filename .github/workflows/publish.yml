name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      # registry-url writes a user-level .npmrc that reads NODE_AUTH_TOKEN (pnpm ignores tokens in the repo's .npmrc).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: https://npm.pkg.github.com
          scope: "@jakoblui-works"
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      # A published version can't be replaced, so only merged code is published.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} isn't on main; merge first, then tag" >&2
            exit 1
          fi
      - run: pnpm install
      # pnpm publish builds first (prepack). A tag checkout is a detached HEAD, which pnpm's git checks reject.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
