# Serves the built Storybook. Files under /assets/ have a content hash in their names, so they never
# change: cached for a year. Everything else (index.json, the HTML) revalidates, so a deploy shows at once.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # No nginx version in headers and error pages.
    server_tokens off;

    # HTML is compressed by default; these are the other text types Storybook serves.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        # storybook.jakoblui.com composes this Storybook (`refs`) and fetches it cross-origin.
        # One location, so both headers apply (a nested location's add_header would replace them).
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control $cache_control;
        try_files $uri $uri/ =404;
    }
}
